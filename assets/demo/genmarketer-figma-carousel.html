<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GENmarketer — Claude→Figma carousel animáció</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root { --tx:#1f1e1d; --muted:#7a776f; --violet:#7C3AED; --cyan:#06B6D4; --line:#e8e5dd; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--tx); -webkit-font-smoothing:antialiased; display:flex; justify-content:center; }
  #anim-wrap { width:100%; max-width:1070px; position:relative; overflow:hidden; }
  #stage { width:1070px; height:720px; position:absolute; top:0; left:0; transform-origin: top left; background:#faf9f5; border-radius:16px; border:1px solid #ded9cf; overflow:hidden; display:flex; flex-direction:column; }

  .chat { flex:none; padding:16px 24px 14px; border-bottom:1px solid var(--line); background:#fff; z-index:2; transform-origin:50% 0; transition:transform .85s cubic-bezier(.22,.9,.3,1), box-shadow .85s; }
  #stage.zoomed .chat { transform:translateY(150px) scale(1.3); box-shadow:0 30px 70px rgba(0,0,0,0.14); }
  .cwrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:11px; }
  .topline { display:flex; align-items:center; gap:12px; }
  .mark { width:34px; height:34px; border-radius:10px; background:#D97757; color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; }
  .topline b { font-size:22px; }
  .ctx { margin-left:auto; display:flex; align-items:center; gap:9px; font-size:17px; font-weight:700; color:var(--violet); background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.25); padding:6px 15px; border-radius:999px; }
  .ctx i { width:10px; height:10px; border-radius:50%; background:var(--violet); font-style:normal; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .u { align-self:flex-end; max-width:85%; background:#eef3fb; border:1px solid #d8e2f3; border-radius:15px 15px 4px 15px; padding:11px 18px; font-size:22px; line-height:1.4; min-height:47px; }
  .caret { display:inline-block; width:2px; height:20px; background:var(--tx); vertical-align:-3px; animation:blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .ack { align-self:flex-start; display:flex; align-items:center; gap:12px; font-size:21px; opacity:0; transition:opacity .35s; }
  .ack.in { opacity:1; }
  .ack .ind { width:26px; height:26px; flex:none; position:relative; }
  .ack .spin { position:absolute; inset:0; border:3px solid #e5e1d8; border-top-color:var(--violet); border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .ack .ok { position:absolute; inset:0; border-radius:50%; background:linear-gradient(135deg,#7C3AED,#06B6D4); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; opacity:0; transform:scale(.6); transition:opacity .25s, transform .25s; }
  .ack.done .spin { display:none; }
  .ack.done .ok { opacity:1; transform:none; }

  .canvas { flex:1; position:relative; background:#F1F0F4; overflow:hidden; opacity:1; transition:opacity .6s .25s; }
  #stage.zoomed .canvas { opacity:0; transition:opacity .3s; }
  .fpill { position:absolute; top:12px; left:16px; z-index:2; font-family:"JetBrains Mono", ui-monospace, monospace; font-size:14px; font-weight:700; color:#54595F; background:#fff; border:1px solid #DDDAE5; border-radius:999px; padding:5px 14px; box-shadow:0 3px 10px rgba(0,0,0,0.08); }
  #wall { position:absolute; top:44px; left:0; height:505px; width:auto; will-change:transform; }

  @media (prefers-reduced-motion: reduce) { #wall { transform:none !important; } }
</style>
</head>
<body>
<div id="anim-wrap">
  <div id="stage" class="zoomed">
    <div class="chat">
      <div class="cwrap">
        <div class="topline"><span class="mark">✳</span><b>Claude</b><span class="ctx"><i></i>MATISSE · Figma</span></div>
        <div class="u" id="u"><span class="caret"></span></div>
        <div class="ack" id="ack"><span class="ind"><span class="spin"></span><span class="ok">✓</span></span><span id="ackTxt">Vettem — építem Figmában…</span></div>
      </div>
    </div>
    <div class="canvas">
      <span class="fpill">GENmarketer.fig — carousel</span>
      <img id="wall" src="/assets/img/proof/figma-carousel-wall.webp" width="4082" height="1080" alt="A 28 fős AI-csapat carousel-kártyái Figmában, 1:1 és 4:5 méretarányban">
    </div>
  </div>
</div>
<script>
(function () {
  var W = 1070, H = 720;
  var wrap = document.getElementById('anim-wrap');
  var stage = document.getElementById('stage');
  function rescale() {
    var s = Math.min(1, wrap.clientWidth / W);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', rescale);
  rescale();

  /* Alvó kapu: ha az animáció nem látszik, a ciklus szünetel */
  var __ioVis = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { __ioVis = en[en.length - 1].isIntersecting; }, { threshold: 0.01 }).observe(stage);
  }
  function awake() { return __ioVis && !document.hidden; }

  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PROMPT = 'Építsd meg a carouselt Figmában 1:1 és 4:5 méretarányban';
  var ACK1 = 'Vettem — építem Figmában…';
  var ACK2 = 'Kész — 9 téma, 1:1 és 4:5 méretarányban.';
  var wall = $('wall');
  var DISPH = 505;
  var IMGW = Math.round(4082 * DISPH / 1080);
  var MAXX = -(IMGW - W);
  var x = 0;

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); }).then(function () {
      if (awake()) return;
      return new Promise(function (r2) {
        var t = setInterval(function () { if (awake()) { clearInterval(t); r2(); } }, 400);
      });
    });
  }
  async function typeInto(el, text) {
    var caret = '<span class="caret"></span>';
    for (var i = 1; i <= text.length; i++) {
      el.innerHTML = text.slice(0, i) + caret;
      await sleep(20);
    }
    el.textContent = text;
  }
  function tweenTo(target, dur) {
    return new Promise(function (res) {
      var startX = x, delta = target - startX, p = 0, last = null;
      function frame(ts) {
        if (!awake()) { last = null; requestAnimationFrame(frame); return; }
        if (last === null) last = ts;
        var dt = ts - last; last = ts;
        p = Math.min(1, p + dt / dur);
        var e = 0.5 - 0.5 * Math.cos(Math.PI * p);
        x = startX + delta * e;
        wall.style.transform = 'translateX(' + x + 'px)';
        if (p < 1) requestAnimationFrame(frame); else res();
      }
      requestAnimationFrame(frame);
    });
  }
  function reset() {
    stage.classList.add('zoomed');
    $('u').innerHTML = '<span class="caret"></span>';
    $('ack').classList.remove('in', 'done');
    $('ackTxt').textContent = ACK1;
    x = 0;
    wall.style.transform = 'translateX(0)';
  }
  function finalState() {
    stage.classList.remove('zoomed');
    $('u').textContent = PROMPT;
    $('ack').classList.add('in', 'done');
    $('ackTxt').textContent = ACK2;
  }

  if (reduced) { finalState(); return; }

  async function run() {
    for (;;) {
      reset();
      await sleep(800);
      await typeInto($('u'), PROMPT);
      await sleep(400);
      $('ack').classList.add('in');
      await sleep(1700);
      $('ack').classList.add('done');
      $('ackTxt').textContent = ACK2;
      await sleep(800);
      stage.classList.remove('zoomed');
      await sleep(1300);
      await tweenTo(MAXX, 12000);
      await sleep(1800);
      await tweenTo(0, 9000);
      await sleep(1400);
    }
  }
  run();
})();
</script>
</body>
</html>
