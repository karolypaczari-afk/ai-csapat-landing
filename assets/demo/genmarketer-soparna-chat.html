<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sópárna-beszélgetés – valódi Claude-munkamenet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  #wrap { width: 100%; position: relative; overflow: hidden; }
  #stage {
    width: 1092px; height: 672px;
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
    background: #faf9f5;
    border: 1px solid #C9CDD6;
    border-radius: 14px;
    overflow: hidden;
  }
  #scrollwin {
    position: absolute; left: 8px; top: 48px;
    width: 756px; height: 624px;
    overflow: hidden;
  }
  #tall {
    display: block; width: 756px;
    transform: translateY(0);
    will-change: transform;
  }
  #frame {
    position: absolute; inset: 0;
    width: 1092px; height: 672px;
    pointer-events: none;
  }
  #dim {
    position: absolute; inset: 0;
    background: rgba(12, 10, 25, 0.55);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #cardhl {
    position: absolute; left: 44px; top: 325px;
    width: 690px; height: 75px;
    opacity: 0;
    transform: scale(1);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 0 3px rgba(124,58,237,0.55);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #cardhl img { display: block; width: 100%; height: 100%; border-radius: 10px; }
  #stage.fade { transition: opacity 0.35s ease; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="scrollwin"><img id="tall" src="/assets/img/proof/soparna-chat-tall.webp" alt=""></div>
    <img id="frame" src="/assets/img/proof/soparna-frame.webp" alt="">
    <div id="dim"></div>
    <div id="cardhl"><img src="/assets/img/proof/soparna-card.webp" alt=""></div>
  </div>
</div>
<script>
(function () {
  var W = 1092, H = 672, MAX = 1085;
  var wrap = document.getElementById("wrap");
  var stage = document.getElementById("stage");
  var tall = document.getElementById("tall");
  var dim = document.getElementById("dim");
  var cardhl = document.getElementById("cardhl");

  function fit() {
    var s = wrap.clientWidth / W;
    stage.style.transform = "scale(" + s + ")";
    wrap.style.height = (H * s) + "px";
  }
  fit();
  window.addEventListener("resize", fit);

  /* alvó kapu: rejtett fülben / képernyőn kívül szünetel */
  var __ioVis = true;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (e) { __ioVis = e.isIntersecting; });
    }, { threshold: 0.01 }).observe(stage);
  }
  function awake() { return __ioVis && !document.hidden; }
  function waitAwake() {
    return new Promise(function (res) {
      (function poll() { if (awake()) return res(); setTimeout(poll, 400); })();
    });
  }
  function sleep(ms) {
    return new Promise(function (res) { setTimeout(res, ms); }).then(waitAwake);
  }

  function finalState() {
    tall.style.transform = "translateY(-" + MAX + "px)";
    dim.style.opacity = "1";
    cardhl.style.opacity = "1";
    cardhl.style.transform = "scale(1.06)";
  }
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finalState();
    return;
  }

  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function scrollTween(from, to, dur) {
    return new Promise(function (res) {
      var start = null;
      function step(ts) {
        if (!awake()) { start = null; requestAnimationFrame(step); return; }
        if (start === null) start = ts - (step.progress || 0) * dur;
        var t = Math.min(1, (ts - start) / dur);
        step.progress = t;
        tall.style.transform = "translateY(" + (from + (to - from) * ease(t)) + "px)";
        if (t < 1) requestAnimationFrame(step); else res();
      }
      requestAnimationFrame(step);
    });
  }

  async function run() {
    for (;;) {
      await waitAwake();
      tall.style.transform = "translateY(0)";
      dim.style.opacity = "0";
      cardhl.style.opacity = "0";
      cardhl.style.transform = "scale(1)";
      stage.style.opacity = "1";
      await sleep(1800);
      await scrollTween(0, -MAX, 12000);
      await sleep(700);
      dim.style.opacity = "1";
      cardhl.style.opacity = "1";
      cardhl.style.transform = "scale(1.06)";
      await sleep(3200);
      stage.classList.add("fade");
      stage.style.opacity = "0";
      await sleep(400);
      stage.classList.remove("fade");
    }
  }
  run();
})();
</script>
</body>
</html>
