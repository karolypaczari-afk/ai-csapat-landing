<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GENmarketer — SEO stratégia animáció</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root { --tx:#1A1A2E; --muted:#54595F; --violet:#7C3AED; --cyan:#06B6D4; --card:#ffffff; --line:#E7E5F0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--tx); -webkit-font-smoothing:antialiased; display:flex; justify-content:center; }
  #anim-wrap { width:100%; max-width:1070px; position:relative; overflow:hidden; }
  #stage { width:1070px; height:720px; position:absolute; top:0; left:0; transform-origin: top left; background:#FAFAFB; border-radius:16px; border:1px solid #E7E5F0; display:flex; flex-direction:column; gap:13px; padding:18px 22px; }

  .head { font-family:"JetBrains Mono", ui-monospace, Consolas, monospace; font-size:21px; color:var(--muted); letter-spacing:.05em; flex:none; }

  .row { background:var(--card); border:1.5px solid #C9CDD6; border-radius:14px; padding:14px 22px; box-shadow:0 5px 14px rgba(0,0,0,0.06); flex:1; display:flex; align-items:center; gap:18px; opacity:0; transform:translateY(12px); transition:opacity .4s, transform .4s; position:relative; }
  .row.in { opacity:1; transform:none; }
  .row b { width:245px; flex:none; font-size:24px; }
  .track { flex:1; height:18px; border-radius:999px; background:#EFEDF6; overflow:hidden; }
  .fill { display:block; height:100%; border-radius:999px; width:0; transition:width .9s ease; background:linear-gradient(90deg,#7C3AED,#06B6D4); }
  .pct { width:72px; text-align:right; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .chip { width:130px; text-align:center; font-size:18px; font-weight:700; border-radius:999px; padding:6px 0; opacity:0; transform:scale(.7); transition:opacity .3s, transform .3s; }
  .chip.in { opacity:1; transform:none; }
  .chip.ok { color:var(--violet); background:rgba(124,58,237,0.08); border:1.5px solid rgba(124,58,237,0.3); }
  .chip.weak { color:#54595F; background:#f0eee8; border:1.5px solid #e0dcd2; }
  .chip.miss { color:#b91c1c; background:#faf1f1; border:1.5px solid rgba(220,38,38,0.3); }

  .ord { position:absolute; top:50%; left:-9px; transform:translate(-50%,-50%) scale(.5); width:42px; height:42px; border-radius:50%; background:#FFC400; color:#1A1A2E; font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .3s, transform .3s; box-shadow:0 3px 8px rgba(0,0,0,0.18); }
  .ord.in { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .row { margin-left:14px; }

  .cap { flex:none; background:rgba(124,58,237,0.08); border:1.5px solid rgba(124,58,237,0.3); border-radius:14px; padding:13px 20px; font-size:23px; text-align:center; opacity:0; transform:translateY(10px); transition:opacity .45s, transform .45s; }
  .cap.in { opacity:1; transform:none; }
  .cap b { color:var(--violet); width:auto; }
</style>
</head>
<body>
<div id="anim-wrap">
  <div id="stage">
    <div class="head">SEO STRATÉGIA — hol állsz, mivel kezdj · VERITAS</div>

    <div class="row" id="r1"><b>On-page SEO</b><span class="track"><span class="fill" data-w="82%"></span></span><span class="pct" data-n="82">0%</span><span class="chip ok">rendben</span></div>
    <div class="row" id="r2"><span class="ord" id="o2">2</span><b>Tartalom-minőség</b><span class="track"><span class="fill" data-w="64%"></span></span><span class="pct" data-n="64">0%</span><span class="chip weak">javítandó</span></div>
    <div class="row" id="r3"><span class="ord" id="o3">3</span><b>Technikai alap</b><span class="track"><span class="fill" data-w="58%"></span></span><span class="pct" data-n="58">0%</span><span class="chip weak">javítandó</span></div>
    <div class="row" id="r4"><span class="ord" id="o4">4</span><b>Schema</b><span class="track"><span class="fill" data-w="35%"></span></span><span class="pct" data-n="35">0%</span><span class="chip miss">hiányos</span></div>
    <div class="row" id="r5"><span class="ord" id="o1">1</span><b>AI-láthatóság</b><span class="track"><span class="fill" data-w="12%"></span></span><span class="pct" data-n="12">0%</span><span class="chip miss">kritikus</span></div>

    <div class="cap" id="cap"><b>A sorrend kész</b> — azzal kezdesz, ami a legtöbbet hozza.</div>
  </div>
</div>
<script>
(function () {
  var W = 1070, H = 720;
  var wrap = document.getElementById('anim-wrap');
  var stage = document.getElementById('stage');
  function rescale() {
    var s = Math.min(1, wrap.clientWidth / W);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', rescale);
  rescale();

  /* Alvó kapu: ha az animáció nem látszik, a ciklus szünetel */
  var __ioVis = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { __ioVis = en[en.length - 1].isIntersecting; }, { threshold: 0.01 }).observe(stage);
  }

  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rows = ['r1','r2','r3','r4','r5'];
  var ords = ['o1','o2','o3','o4'];

  function waitAwake() {
    if (__ioVis && !document.hidden) return;
    return new Promise(function (r) {
      var t = setInterval(function () { if (__ioVis && !document.hidden) { clearInterval(t); r(); } }, 400);
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }).then(waitAwake); }
  async function countUp(el, target, steps) {
    for (var i = 1; i <= steps; i++) {
      el.textContent = Math.round(target * i / steps) + '%';
      await sleep(55);
    }
  }
  function partsOf(id) {
    var row = $(id);
    return { row: row, fill: row.querySelector('.fill'), pct: row.querySelector('.pct'), chip: row.querySelector('.chip') };
  }
  function reset() {
    rows.forEach(function (id) {
      var p = partsOf(id);
      p.row.classList.remove('in');
      p.fill.style.width = '0';
      p.pct.textContent = '0%';
      p.chip.classList.remove('in');
    });
    ords.forEach(function (id) { $(id).classList.remove('in'); });
    $('cap').classList.remove('in');
  }
  function finalState() {
    rows.forEach(function (id) {
      var p = partsOf(id);
      p.row.classList.add('in');
      p.fill.style.width = p.fill.getAttribute('data-w');
      p.pct.textContent = p.pct.getAttribute('data-n') + '%';
      p.chip.classList.add('in');
    });
    ords.forEach(function (id) { $(id).classList.add('in'); });
    $('cap').classList.add('in');
  }

  if (reduced) { finalState(); return; }

  async function run() {
    for (;;) {
      reset();
      await sleep(600);
      for (var i = 0; i < rows.length; i++) {
        var p = partsOf(rows[i]);
        p.row.classList.add('in');
        await sleep(280);
        p.fill.style.width = p.fill.getAttribute('data-w');
        countUp(p.pct, parseInt(p.pct.getAttribute('data-n'), 10), 12);
        await sleep(750);
        p.chip.classList.add('in');
        await sleep(280);
      }
      await sleep(500);
      for (var k = 0; k < ords.length; k++) {
        $(ords[k]).classList.add('in');
        await sleep(320);
      }
      await sleep(500);
      $('cap').classList.add('in');
      await sleep(5000);
    }
  }
  run();
})();
</script>
</body>
</html>
