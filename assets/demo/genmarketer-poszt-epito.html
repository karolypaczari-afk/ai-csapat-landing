<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GENmarketer — poszt-variációk animáció</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root { --tx:#1A1A2E; --muted:#54595F; --violet:#7C3AED; --cyan:#06B6D4; --card:#ffffff; --line:#E7E5F0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--tx); -webkit-font-smoothing:antialiased; display:flex; justify-content:center; }
  #anim-wrap { width:100%; max-width:1070px; position:relative; overflow:hidden; }
  #stage { width:1070px; height:720px; position:absolute; top:0; left:0; transform-origin: top left; background:#FAFAFB; border-radius:16px; border:1px solid #E7E5F0; display:flex; flex-direction:column; gap:14px; padding:18px 22px; }

  .head { font-family:"JetBrains Mono", ui-monospace, Consolas, monospace; font-size:21px; color:var(--muted); letter-spacing:.05em; flex:none; }

  .theme { flex:none; background:var(--card); border:1.5px solid rgba(124,58,237,0.45); border-radius:14px; padding:14px 22px; box-shadow:0 5px 14px rgba(0,0,0,0.06); display:flex; align-items:center; gap:16px; }
  .theme small { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:15px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; flex:none; }
  .theme .t { font-size:26px; font-weight:700; min-height:34px; }
  .caret { display:inline-block; width:2px; height:22px; background:var(--tx); vertical-align:-3px; animation:blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .cols { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .post { background:var(--card); border:1.5px solid #C9CDD6; border-radius:16px; padding:16px 20px; box-shadow:0 6px 16px rgba(0,0,0,0.06); display:flex; flex-direction:column; gap:12px; opacity:0; transform:translateY(14px); transition:opacity .45s, transform .45s; }
  .post.in { opacity:1; transform:none; }
  .prow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pill { font-size:15px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:#fff; border-radius:999px; padding:4px 13px; white-space:nowrap; }
  #p1 .pill { background:var(--violet); }
  #p2 .pill { background:var(--cyan); }
  #p3 .pill { background:#FFC400; color:#1A1A2E; }
  .fmt { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:15px; color:var(--muted); white-space:nowrap; }

  .hook { font-size:23.5px; font-weight:800; line-height:1.35; min-height:130px; }
  .bars { opacity:0; transition:opacity .4s; }
  .bars.in { opacity:1; }
  .bars i { display:block; height:11px; border-radius:999px; background:#E7E5F0; }
  .bars i + i { margin-top:7px; width:70%; }

  .voice { margin-top:auto; display:flex; align-items:center; gap:9px; font-size:17px; font-weight:700; opacity:0; transform:scale(.75); transition:opacity .3s, transform .3s; }
  .voice.in { opacity:1; transform:none; }
  .voice .ok { width:25px; height:25px; border-radius:50%; background:linear-gradient(135deg,#7C3AED,#06B6D4); color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }

  .cap { flex:none; background:rgba(124,58,237,0.08); border:1.5px solid rgba(124,58,237,0.3); border-radius:14px; padding:13px 20px; font-size:23px; text-align:center; opacity:0; transform:translateY(10px); transition:opacity .45s, transform .45s; }
  .cap.in { opacity:1; transform:none; }
  .cap b { color:var(--violet); }
</style>
</head>
<body>
<div id="anim-wrap">
  <div id="stage">
    <div class="head">POSZT-VARIÁCIÓK — egy téma, három hook · FIGARO</div>

    <div class="theme"><small>A téma</small><span class="t" id="theme"><span class="caret"></span></span></div>

    <div class="cols">
      <div class="post" id="p1">
        <div class="prow"><span class="pill">kérdés-hook</span><span class="fmt">kép-poszt</span></div>
        <div class="hook" id="h1"><span class="caret"></span></div>
        <div class="bars" id="b1"><i></i><i></i></div>
        <span class="voice" id="v1"><span class="ok">✓</span>márkahang</span>
      </div>
      <div class="post" id="p2">
        <div class="prow"><span class="pill">sztori-hook</span><span class="fmt">szöveges</span></div>
        <div class="hook" id="h2"><span class="caret"></span></div>
        <div class="bars" id="b2"><i></i><i></i></div>
        <span class="voice" id="v2"><span class="ok">✓</span>márkahang</span>
      </div>
      <div class="post" id="p3">
        <div class="prow"><span class="pill">kontra-hook</span><span class="fmt">carousel</span></div>
        <div class="hook" id="h3"><span class="caret"></span></div>
        <div class="bars" id="b3"><i></i><i></i></div>
        <span class="voice" id="v3"><span class="ok">✓</span>márkahang</span>
      </div>
    </div>

    <div class="cap" id="cap"><b>Egy témából teljes készlet</b> — a te hangodon, magyar minőség-kapun át.</div>
  </div>
</div>
<script>
(function () {
  var W = 1070, H = 720;
  var wrap = document.getElementById('anim-wrap');
  var stage = document.getElementById('stage');
  function rescale() {
    var s = Math.min(1, wrap.clientWidth / W);
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', rescale);
  rescale();

  /* Alvó kapu: ha az animáció nem látszik, a ciklus szünetel */
  var __ioVis = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { __ioVis = en[en.length - 1].isIntersecting; }, { threshold: 0.01 }).observe(stage);
  }

  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var THEME = 'Mitől drágul meg egy felújítás?';
  var HOOKS = [
    'Miből lesz a 2 milliós árajánlatból 3,4 millió?',
    'A múlt héten lefújtunk egy munkát. A miénket.',
    'Nem a munkadíj veri fel az árat. Hanem ez a 3 apróság.'
  ];

  function waitAwake() {
    if (__ioVis && !document.hidden) return;
    return new Promise(function (r) {
      var t = setInterval(function () { if (__ioVis && !document.hidden) { clearInterval(t); r(); } }, 400);
    });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }).then(waitAwake); }
  async function typeInto(el, text) {
    var caret = '<span class="caret"></span>';
    for (var i = 1; i <= text.length; i++) {
      el.innerHTML = text.slice(0, i) + caret;
      await sleep(20);
    }
    el.textContent = text;
  }
  function reset() {
    $('theme').innerHTML = '<span class="caret"></span>';
    for (var i = 1; i <= 3; i++) {
      $('p' + i).classList.remove('in');
      $('b' + i).classList.remove('in');
      $('v' + i).classList.remove('in');
      $('h' + i).innerHTML = '<span class="caret"></span>';
    }
    $('cap').classList.remove('in');
  }
  function finalState() {
    $('theme').textContent = THEME;
    for (var i = 1; i <= 3; i++) {
      $('p' + i).classList.add('in');
      $('b' + i).classList.add('in');
      $('v' + i).classList.add('in');
      $('h' + i).textContent = HOOKS[i - 1];
    }
    $('cap').classList.add('in');
  }

  if (reduced) { finalState(); return; }

  async function run() {
    for (;;) {
      reset();
      await sleep(600);
      await typeInto($('theme'), THEME);
      await sleep(500);
      for (var i = 1; i <= 3; i++) {
        $('p' + i).classList.add('in');
        await sleep(350);
        await typeInto($('h' + i), HOOKS[i - 1]);
        await sleep(280);
        $('b' + i).classList.add('in');
        await sleep(300);
        $('v' + i).classList.add('in');
        await sleep(300);
      }
      await sleep(400);
      $('cap').classList.add('in');
      await sleep(5200);
    }
  }
  run();
})();
</script>
</body>
</html>
