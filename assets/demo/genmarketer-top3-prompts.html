<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GENmarketer: rövid promptok a ChatGPT és Claude felületén (animáció)</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  /* A színpad 1070×720, de ~534px szélesen renderelődik → minden méret ~2×-es,
     hogy fél-skálán is olvasható maradjon. Két skin: Claude és ChatGPT. */
  /* V5-paletta (2026-11-03): egy akcentus (világoskék), a lila csak a márkagradiensben.
     A 480 px körüli renderelt méretek a színpadon ~2,23-szorosak (1 px vonal = 2 px). */
  :root { --tx:#14162A; --muted:#5C6470; --violet:#00748A; --green:#00748A; --accent:#06B6D4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; height:100%; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--tx); -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center; overflow:hidden; }

  #anim-wrap { width:100%; max-width:1070px; position:relative; overflow:hidden; }
  #stage { width:1070px; height:720px; position:absolute; top:0; left:0; transform-origin: top left; }

  .window { width:100%; height:100%; border-radius:36px; overflow:hidden; display:flex; flex-direction:column; transition:opacity .35s; }
  .window.swap { opacity:0; }
  /* Claude- és ChatGPT-ablak: ugyanaz a paletta, csak a név és a logó tér el */
  .window, .window.gpt { --bg:#FFFFFF; --line:#E4EAF1; --user:#EAF9FD; --ubr:#BFEFF9; --mark:#14162A; background:var(--bg); border:2px solid #D9E6EC; }

  .topbar { display:flex; align-items:center; gap:16px; padding:20px 28px; border-bottom:2px solid var(--line); background:#FFFFFF; }
  .mark { width:40px; height:40px; flex:none; border-radius:50%; background:#14162A url(/assets/img/icon-claude.svg) center / 64% no-repeat; font-size:0; color:transparent; }
  .window.gpt .mark { background-image:url(/assets/img/icon-chatgpt.svg); }
  .topbar b { font-size:26px; font-weight:700; color:var(--tx); }
  .topbar small { margin-left:auto; font-size:19px; font-weight:400; color:var(--muted); }

  .chat { flex:1; padding:30px 32px; display:flex; flex-direction:column; gap:20px; overflow:hidden; }

  .msg { max-width:88%; opacity:0; transform:translateY(12px); transition:opacity .4s, transform .4s; }
  .msg.in { opacity:1; transform:none; }
  .u { align-self:flex-end; background:var(--user); border:2px solid var(--ubr); border-radius:36px 36px 9px 36px; padding:16px 26px; font-size:27px; font-weight:400; line-height:1.45; min-height:72px; color:var(--tx); }
  .caret { display:inline-block; width:3px; height:28px; background:var(--tx); vertical-align:-4px; margin-left:3px; animation:ck .9s steps(1) infinite; }
  @keyframes ck { 50% { opacity:0; } }
  .u.done .caret { display:none; }

  .typing { align-self:flex-start; display:none; gap:7px; padding:10px 20px; }
  .typing.on { display:flex; }
  .typing s { width:11px; height:11px; border-radius:50%; background:#A9C7D3; animation:tp 1s infinite; text-decoration:none; }
  .typing s:nth-child(2){ animation-delay:.18s; } .typing s:nth-child(3){ animation-delay:.36s; }
  @keyframes tp { 0%,100%{opacity:.35; transform:translateY(0)} 50%{opacity:1; transform:translateY(-4px)} }

  .a { align-self:flex-start; width:88%; font-size:27px; line-height:1.5; display:flex; gap:14px; }
  .a .dot { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#7C3AED,#00D4FF); flex:none; margin-top:4px; }
  .a .body { flex:1; display:flex; flex-direction:column; gap:16px; }
  .a p b { font-weight:700; color:var(--tx); }

  /* connector-hívás kártya (tool call) */
  .conn { display:flex; align-items:center; gap:14px; padding:16px 22px; border:2px solid rgba(6,182,212,.35); background:#F0FBFE; border-radius:27px; font-size:23px; font-weight:700; color:#00748A; opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s, border-color .4s, box-shadow .4s; }
  .conn.in { opacity:1; transform:none; }
  .conn .ind { position:relative; width:30px; height:30px; flex:none; }
  .conn .spin { position:absolute; inset:0; border-radius:50%; border:4px solid rgba(6,182,212,.22); border-top-color:#06B6D4; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .conn .ok { position:absolute; inset:0; border-radius:50%; background:#00748A; color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; opacity:0; transform:scale(.6); transition:opacity .25s, transform .25s; }
  .conn.done .spin { display:none; }
  .conn.done .ok { opacity:1; transform:none; }
  .conn .st { margin-left:auto; font-size:19px; font-weight:600; color:var(--muted); }
  /* finom mozgás csak animált módban: a kártya balról csúszik be, a pipa felpattan */
  @media (prefers-reduced-motion: no-preference) {
    .conn { transform:translate(-14px, 8px); }
    .conn.in { transform:none; }
    .conn.done { border-color:rgba(6,182,212,.55); box-shadow:0 0 0 6px rgba(6,182,212,.08); }
    .conn.done .ok { animation:okpop .42s cubic-bezier(.3,1.7,.5,1); }
    @keyframes okpop { 0% { transform:scale(.4); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }
  }

  /* dolgozik: halványkék vázsorok */
  .bars { display:flex; flex-direction:column; gap:12px; }
  /* a chat elemei ne zsugorodjanak (telefonon a buborék összenyomódott, a szöveg kilógott belőle) */
  .msg, .typing { flex-shrink:0; }
  /* keskeny (640 egységes, telefonos) nézet: kisebb térköz, három vázsor, hogy a válasz az üzenetsáv fölött maradjon */
  body.narrow .chat { padding:24px 28px; gap:16px; }
  body.narrow .a .body { gap:14px; }
  body.narrow .b4 { display:none; }
  .bar { height:20px; border-radius:10px; background:linear-gradient(90deg,#E6EEF4,#F2F7FA,#E6EEF4); background-size:200% 100%; animation:shm 1.4s linear infinite; opacity:0; transition:opacity .35s; }
  @keyframes shm { to { background-position:-200% 0; } }
  .bar.in { opacity:1; }
  .b1 { width:92%; } .b2 { width:78%; } .b3 { width:85%; } .b4 { width:55%; }

  /* beviteli sav alul, hogy a magas ablak termeszetes chat-kepet adjon */
  .inbar { margin: 0 30px 26px; padding: 18px 26px; border: 2px solid var(--line); border-radius: 999px; background: #FFFFFF; color: var(--muted); font-size: 23px; display: flex; align-items: center; flex: none; }
  .inbar .send { margin-left: auto; width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg,#400099,#7C3AED 55%,#4D6CE3); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 21px; }
</style>
</head>
<body>
<div id="anim-wrap">
  <div id="stage">
    <div class="window" id="win">
      <div class="topbar"><div class="mark" id="mark">✳</div><b id="brand">Claude</b><small>GENmarketer AI-csapat telepítve</small></div>
      <div class="chat">
        <div class="msg u" id="mu"><span id="ptext"></span><span class="caret"></span></div>
        <div class="typing" id="ty"><s></s><s></s><s></s></div>
        <div class="msg a" id="ma">
          <span class="dot"></span>
          <div class="body">
            <div class="conn" id="conn"><span class="ind"><span class="spin"></span><span class="ok">✓</span></span><span id="cname">GENmarketer connector · Meta Ads</span><span class="st" id="cstate">kapcsolódás…</span></div>
            <p id="alead"><b></b></p>
            <div class="bars"><span class="bar b1" id="b1"></span><span class="bar b2" id="b2"></span><span class="bar b3" id="b3"></span><span class="bar b4" id="b4"></span></div>
          </div>
        </div>
      </div>
      <div class="inbar"><span>Írj üzenetet…</span><span class="send">▸</span></div>
    </div>
  </div>
</div>
<script>
(function () {
  var W = 1070, H = 720;
  var wrap = document.getElementById('anim-wrap');
  var stage = document.getElementById('stage');
  function rescale() {
    /* szelesseg-alapu skala; az ablak magassaga a rendelkezesre allo teljes
       magassaghoz igazodik, igy az animacio kitolti a kartya media-savjat.
       Keskeny (mobil) wrapnel a tervezoszelesseg 640-re valt, kulonben a
       0,3x-es skala olvashatatlanna kicsinyitene a chatet; a buborekok
       szazalekos szelessege miatt a tartalom magatol ujratordel.
       A kuszob 420: a telefonos wrap ~325, a desktop OLDALSO panel ~500,
       es a desktopnak az eredeti 1070-es nezet jar (640-nel tul nagy lenne). */
    W = wrap.clientWidth < 420 ? 640 : 1070;
    document.body.classList.toggle('narrow', W === 640);
    stage.style.width = W + 'px';
    var s = Math.min(1, wrap.clientWidth / W);
    /* 2026-11-02: a plafon 1250-rol 1400-ra, mert a landolo kompakt TOP 3 szinpadja a bal hasab
       magassagat veszi fel, es 1100 px koruli ablaknal 1250 egyseggel also csik maradt. */
    var hUnits = Math.max(560, Math.min(1400, Math.round((window.innerHeight || H) / s)));
    stage.style.height = hUnits + 'px';
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = (hUnits * s) + 'px';
    stage.style.left = Math.max(0, (wrap.clientWidth - W * s) / 2) + 'px';
  }
  window.addEventListener('resize', rescale);
  rescale();

  /* Alvó kapu: ha az animáció nem látszik, a ciklus szünetel */
  var __ioVis = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { __ioVis = en[en.length - 1].isIntersecting; }, { threshold: 0.01 }).observe(stage);
  }
  function waitAwake() {
    if (__ioVis && !document.hidden) return;
    return new Promise(function (r) {
      var t = setInterval(function () { if (__ioVis && !document.hidden) { clearInterval(t); r(); } }, 400);
    });
  }
  /* 2026-11-03 (Tibor): kb. 50%-kal gyorsabb tempó; minden várakozás (a gépelés is) ezzel osztódik */
  var SPEED = 1.5;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms / SPEED); }).then(waitAwake); }

  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Három jelenetsor, kártyánként: ?set=ads|web|szoveg választ (alapértelmezés: ads) */
  var SETS = {
    ads: [
      { gpt: false,
        prompt: 'Világítsd át a Meta-fiókomat: mi viszi a pénzt, mit cseréljek?',
        chip: 'GENmarketer connector · Meta Ads',
        lead: 'Csatlakoztam a fiókodhoz, átnézem az elmúlt 30 napot…' },
      { gpt: true,
        prompt: 'Építsd fel a jóváhagyott tavaszi kampányt a fiókomban.',
        chip: 'GENmarketer connector · Meta Ads',
        lead: 'Építem a kampányt: minden szüneteltetve készül, te élesíted…' },
      { gpt: false,
        prompt: 'Állítsd össze a heti Google Ads-riportot: mi javult, mi romlott?',
        chip: 'GENmarketer connector · Google Ads',
        lead: 'Lekértem a számokat a fiókodból, összerakom a riportot…' }
    ],
    web: [
      { gpt: false,
        prompt: 'Nézd át a weboldalamat: hol veszítem a látogatókat?',
        chip: 'GENmarketer connector · GA4',
        lead: 'Lekértem a GA4- és Clarity-adatokat, keresem a kieséseket…' },
      { gpt: true,
        prompt: 'Tervezd újra a főoldalam szekciónként, kész szöveggel.',
        chip: 'MIDÁSZ · landolóoldal-tervező',
        lead: 'Szekciónként építem: headline, ajánlat, bizonyíték, CTA…' },
      { gpt: false,
        prompt: 'Készítsd el Figmában, és add át működő kódként.',
        chip: 'Figma-terv → működő kód',
        lead: 'Megrajzolom a tervet, és átadom a kész, mobilra optimalizált kódot…' }
    ],
    szoveg: [
      { gpt: true,
        prompt: 'Írj 10 hirdetésszöveget a legjobban futó hirdetésem stílusában.',
        chip: 'GENmarketer connector · Meta Ads',
        lead: 'Beolvastam a top hirdetésed, írom a variációkat…' },
      { gpt: false,
        prompt: 'Írd meg a 20 részes üdvözlő sorozatot, és állítsd be a fiókomban.',
        chip: 'GENmarketer connector · MailerLite',
        lead: 'Megírom a leveleket, és sorozatba rendezem a MailerLite-fiókodban…' },
      { gpt: true,
        prompt: 'Szűrd ki az AI-ízű mondatokat a szövegemből.',
        chip: 'Magyar nyelvi QA',
        lead: 'Átfésülöm: tükörfordítás, magyartalan szerkezet, AI-közhely…' }
    ]
  };
  var setKey = 'ads';
  try { setKey = new URLSearchParams(location.search).get('set') || 'ads'; } catch (e) {}
  var SCENES = (SETS[setKey] || SETS.ads).map(function (sc) {
    sc.brand = sc.gpt ? 'ChatGPT' : 'Claude';
    sc.mark = sc.gpt ? '✦' : '✳';
    return sc;
  });

  function setScene(sc) {
    var win = $('win');
    win.classList.toggle('gpt', sc.gpt);
    $('brand').textContent = sc.brand;
    $('mark').textContent = sc.mark;
    $('cname').textContent = sc.chip;
    $('alead').querySelector('b').textContent = sc.lead;
    $('ptext').textContent = '';
  }
  function resetStates() {
    $('mu').classList.remove('in', 'done');
    $('ty').classList.remove('on');
    $('ma').classList.remove('in');
    $('conn').classList.remove('in', 'done');
    $('cstate').textContent = 'kapcsolódás…';
    ['b1','b2','b3','b4'].forEach(function (id) { $(id).classList.remove('in'); });
  }
  function finalState() {
    /* a Figma „Animációk” kerete szerint: a webes és a szövegírós sor a 2. jelenetet mutatja (ChatGPT, illetve MailerLite) */
    var still = SCENES[setKey === 'ads' ? 0 : 1] || SCENES[0];
    setScene(still);
    $('ptext').textContent = still.prompt;
    $('mu').classList.add('in', 'done');
    $('ma').classList.add('in');
    $('conn').classList.add('in', 'done');
    $('cstate').textContent = 'kész';
    ['b1','b2','b3','b4'].forEach(function (id) { $(id).classList.add('in'); });
  }
  if (reduced) { finalState(); return; }

  async function typeText(str) {
    var el = $('ptext');
    for (var i = 0; i < str.length; i++) {
      el.textContent += str[i];
      await sleep(str[i] === ' ' ? 14 : 26);
    }
  }

  async function run() {
    var i = 0;
    for (;;) {
      var sc = SCENES[i % SCENES.length];
      var win = $('win');
      win.classList.add('swap');
      await sleep(380);
      resetStates();
      setScene(sc);
      win.classList.remove('swap');
      await sleep(600);
      $('mu').classList.add('in');
      await sleep(400);
      await typeText(sc.prompt);
      $('mu').classList.add('done');
      await sleep(500);
      $('ty').classList.add('on');
      await sleep(1000);
      $('ty').classList.remove('on');
      $('ma').classList.add('in');
      await sleep(300);
      $('conn').classList.add('in');
      await sleep(1400);
      $('conn').classList.add('done');
      $('cstate').textContent = 'kész';
      await sleep(500);
      var bars = ['b1','b2','b3','b4'];
      for (var k = 0; k < bars.length; k++) { $(bars[k]).classList.add('in'); await sleep(620); }
      await sleep(2600);
      i++;
    }
  }
  run();
})();
</script>
</body>
</html>
